[package]
name = "wvu_bioinstrumentation_studio"
version = "1.1.0"
default-run = "wvu_bioinstrumentation_studio"
license = "Apache-2.0"
description = "Firmware, acquisition, and calibration for BMEG 420L"
authors = ["West Virginia University Department of Chemical and Biomedical Engineering"]
repository = "https://github.com/danielduqueurrego/wvu-bioinstrumentation-studio"
# The README, not the bare repository URL, which Cargo's redundant_homepage
# lint flags.
homepage = "https://github.com/danielduqueurrego/wvu-bioinstrumentation-studio#readme"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wvu_bioinstrumentation_studio_lib"
# Windows desktop only: the application binary links this library as an rlib.
# Tauri's template also lists "staticlib" and "cdylib", which only iOS and
# Android builds need; they cost link time on every release build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2.0.19"
chrono = { version = "0.4.45", features = ["serde"] }
serialport = "4.9.0"
fs2 = "0.4.3"
tauri-plugin-dialog = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
